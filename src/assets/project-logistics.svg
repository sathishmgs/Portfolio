<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" fill="none">
  <defs>
    <linearGradient id="logBg" x1="0" y1="0" x2="640" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#12182c" />
    </linearGradient>
    <linearGradient id="logAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="640" height="380" fill="url(#logBg)" />
  <circle cx="530" cy="80" r="140" fill="#f59e0b" fill-opacity="0.12" />
  <circle cx="100" cy="300" r="130" fill="#38bdf8" fill-opacity="0.12" />

  <!-- Outer Window -->
  <rect x="44" y="34" width="552" height="312" rx="16" fill="#0b1325" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Navigation -->
  <rect x="64" y="52" width="512" height="40" rx="10" fill="#0f1930" />
  <circle cx="84" cy="72" r="5" fill="#ef4444" />
  <circle cx="98" cy="72" r="5" fill="#f59e0b" />
  <circle cx="112" cy="72" r="5" fill="#10b981" />
  
  <rect x="136" y="64" width="134" height="16" rx="6" fill="url(#logAccent)" />
  <text x="144" y="76" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">LOGISTICS &amp; FLEET</text>
  
  <rect x="410" y="62" width="80" height="20" rx="10" fill="#1e293b" />
  <text x="450" y="76" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">GPS SYNC</text>
  
  <rect x="498" y="62" width="66" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
  <text x="531" y="76" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="9" font-weight="700">IN TRANSIT</text>

  <!-- Metric Badges Row -->
  <rect x="64" y="104" width="118" height="64" rx="10" fill="#111c34" stroke="#1e293b" />
  <text x="76" y="122" fill="#94a3b8" font-family="system-ui" font-size="9">Active Vehicles</text>
  <text x="76" y="146" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="800">46 Units</text>
  <rect x="76" y="154" width="50" height="4" rx="2" fill="#38bdf8" />

  <rect x="194" y="104" width="118" height="64" rx="10" fill="#111c34" stroke="#1e293b" />
  <text x="206" y="122" fill="#94a3b8" font-family="system-ui" font-size="9">Shipments Out</text>
  <text x="206" y="146" fill="#f59e0b" font-family="system-ui" font-size="18" font-weight="800">328</text>
  <rect x="206" y="154" width="55" height="4" rx="2" fill="#f59e0b" />

  <rect x="324" y="104" width="118" height="64" rx="10" fill="#111c34" stroke="#1e293b" />
  <text x="336" y="122" fill="#94a3b8" font-family="system-ui" font-size="9">Delivered Today</text>
  <text x="336" y="146" fill="#34d399" font-family="system-ui" font-size="18" font-weight="800">98.2%</text>
  <rect x="336" y="154" width="60" height="4" rx="2" fill="#10b981" />

  <rect x="454" y="104" width="122" height="64" rx="10" fill="#111c34" stroke="#1e293b" />
  <text x="466" y="122" fill="#94a3b8" font-family="system-ui" font-size="9">Average ETA</text>
  <text x="466" y="146" fill="#38bdf8" font-family="system-ui" font-size="18" font-weight="800">2.4 Hrs</text>
  <rect x="466" y="154" width="45" height="4" rx="2" fill="#38bdf8" />

  <!-- Left: Shipment Route Map Simulation -->
  <rect x="64" y="180" width="310" height="148" rx="12" fill="#0d162b" stroke="#1e293b" />
  <text x="80" y="202" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="700">Hub Route: Madurai &rarr; Virudhunagar &rarr; Rajapalayam</text>

  <!-- Route Line & Nodes -->
  <line x1="90" y1="262" x2="340" y2="236" stroke="#334155" stroke-width="4" stroke-dasharray="6 4" />
  <polyline points="90,262 170,254 250,244" stroke="#38bdf8" stroke-width="3" fill="none" />
  
  <circle cx="90" cy="262" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
  <circle cx="90" cy="262" r="4" fill="#10b981" />
  <text x="90" y="286" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="8">MADURAI HUB</text>

  <circle cx="170" cy="254" r="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
  <circle cx="170" cy="254" r="3" fill="#38bdf8" />
  <text x="170" y="278" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace" font-size="8">VIRUDHUNAGAR</text>

  <!-- Truck Marker -->
  <rect x="236" y="232" width="28" height="18" rx="4" fill="url(#logAccent)" />
  <text x="250" y="244" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800">TRK-09</text>

  <circle cx="340" cy="236" r="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
  <circle cx="340" cy="236" r="4" fill="#f59e0b" />
  <text x="340" y="260" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace" font-size="8">RAJAPALAYAM</text>

  <rect x="80" y="298" width="278" height="20" rx="5" fill="#111f38" />
  <text x="90" y="312" fill="#cbd5e1" font-family="ui-monospace" font-size="9">AWB #LGX-8829104 &bull; Status: Out for Last-Mile Delivery</text>

  <!-- Right: Dispatch Consignment Manifest -->
  <rect x="386" y="180" width="190" height="148" rx="12" fill="#0d162b" stroke="#1e293b" />
  <text x="402" y="202" fill="#e2e8f0" font-family="system-ui" font-size="11" font-weight="700">Fleet Operations</text>
  
  <rect x="402" y="216" width="158" height="26" rx="5" fill="#12203b" />
  <text x="410" y="232" fill="#cbd5e1" font-family="ui-monospace" font-size="8.5">Van 14: Dispatched</text>
  <rect x="524" y="222" width="30" height="14" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="539" y="232" text-anchor="middle" fill="#34d399" font-family="ui-monospace" font-size="8">OK</text>

  <rect x="402" y="248" width="158" height="26" rx="5" fill="#0f1a30" />
  <text x="410" y="264" fill="#cbd5e1" font-family="ui-monospace" font-size="8.5">Truck 09: En Route</text>
  <rect x="524" y="254" width="30" height="14" rx="4" fill="#38bdf8" fill-opacity="0.2" />
  <text x="539" y="264" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace" font-size="8">RUN</text>

  <rect x="402" y="280" width="158" height="26" rx="5" fill="#12203b" />
  <text x="410" y="296" fill="#cbd5e1" font-family="ui-monospace" font-size="8.5">Carrier 03: Loading</text>
  <rect x="524" y="286" width="30" height="14" rx="4" fill="#f59e0b" fill-opacity="0.2" />
  <text x="539" y="296" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace" font-size="8">LOAD</text>

  <rect x="402" y="312" width="158" height="6" rx="3" fill="#1e293b" />
</svg>
